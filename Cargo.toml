[workspace]
members = ["src-tauri"]
resolver = "2"

# Dependency versions are declared once here and referenced from the members with
# `workspace = true`, so every crate in the workspace resolves to the same
# version.
[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
# https://github.com/Narsil/rdev/pull/153
rdev = { git = "https://github.com/Narsil/rdev", features = ["serialize"] }

# Profiles are only read from the workspace root; declaring them in a member is
# silently ignored, which would drop these release optimizations.
[profile.release]
debug = false
lto = true
strip = true
opt-level = "s"
codegen-units = 1

[profile.bloaty]
debug = true
lto = false
strip = false
inherits = "release"
