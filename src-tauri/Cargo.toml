[package]
name = "input-viz"
version = "0.1.2"
description = "input-viz displays keystrokes and mouse actions directly on your desktop"
authors = ["ahaoboy"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ahaoboy/input-viz"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "input_viz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
rdev = { workspace = true }

# Only used to drive the `log` facade; enabled by the `RUST_LOG` environment
# variable and silent when it is unset.
env_logger = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
